# GitHub Pages 배포: main 브랜치에 푸시되면 저장소 루트를 그대로 정적 사이트로 게시합니다.
# Pages 활성화는 워크플로가 자동으로 처리합니다(enablement: true). 수동으로 하려면
# 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# (선택) Firebase 설정값을 저장소에 커밋하고 싶지 않다면 Settings → Secrets and variables → Actions 에
# FIREBASE_CONFIG_JSON 시크릿을 만들고 Firebase 콘솔의 firebaseConfig 객체를 JSON으로 넣으세요. 예:
# {"apiKey":"...","authDomain":"...","databaseURL":"https://....firebasedatabase.app","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}
# 시크릿이 있으면 배포 시 js/firebase-config.js 의 firebaseConfig 를 그 값으로 바꿔 넣습니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase config from secret (optional)
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            echo "$FIREBASE_CONFIG_JSON" | python3 -c 'import json,sys; json.load(sys.stdin)' || { echo "FIREBASE_CONFIG_JSON is not valid JSON"; exit 1; }
            python3 - <<'PY'
          import os, re
          cfg = os.environ["FIREBASE_CONFIG_JSON"].strip()
          path = "js/firebase-config.js"
          src = open(path, encoding="utf-8").read()
          new, n = re.subn(r"const firebaseConfig = \{.*?\};", "const firebaseConfig = " + cfg + ";", src, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("firebaseConfig block not found in " + path)
          open(path, "w", encoding="utf-8").write(new)
          print("firebaseConfig injected from secret")
          PY
          else
            echo "No FIREBASE_CONFIG_JSON secret; using js/firebase-config.js as committed"
          fi

      - name: Check Firebase config is filled in
        run: |
          if grep -q "여기에-붙여넣기" js/firebase-config.js; then
            echo "::warning::js/firebase-config.js 에 Firebase 설정값이 아직 없습니다. 파일을 채우거나 FIREBASE_CONFIG_JSON 시크릿을 추가하세요. 사이트는 배포되지만 로그인이 동작하지 않습니다."
          fi

      - name: 캐시 무효화 (css/js 주소에 커밋 해시를 붙임)
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          ver = os.environ["GITHUB_SHA"][:8]
          pat = re.compile(r'(\s(?:src|href)=")((?:\.\./)?(?:(?:css|js)/[A-Za-z0-9_.-]+\.(?:css|js)|favicon\.svg))(")')
          n = 0
          for f in pathlib.Path(".").rglob("*.html"):
              if ".git" in f.parts:
                  continue
              src = f.read_text(encoding="utf-8")
              new, k = pat.subn(lambda m: m.group(1) + m.group(2) + "?v=" + ver + m.group(3), src)
              if k:
                  f.write_text(new, encoding="utf-8")
                  n += k
          print(f"{n} references stamped with ?v={ver}")
          PY

      - name: Setup Pages (Pages가 꺼져 있으면 자동으로 켬)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
