<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 관리자 - CASINO ROYALE</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="robots" content="noindex, nofollow">
  <style>
    .gate-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .gate-overlay.hidden { display: none; }
    .gate-box {
      background: var(--bg-card); border: 1px solid rgba(231,76,60,0.4);
      border-radius: 16px; padding: 36px; width: 100%; max-width: 380px; text-align: center;
    }
    .gate-box h2 { color: var(--red); font-size: 20px; margin-bottom: 6px; }
    .gate-box p { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }
    .gate-box input {
      width: 100%; padding: 12px 16px; background: var(--bg-primary);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--text);
      font-size: 18px; text-align: center; letter-spacing: 6px; font-family: inherit; outline: none;
      margin-bottom: 14px;
    }
    .gate-box input:focus { border-color: var(--red); }
    .gate-err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; }
    .admin-body { display: none; }
    .admin-body.open { display: block; }
  </style>
</head>
<body>
  <!-- 관리자 비밀번호 게이트 -->
  <div class="gate-overlay" id="gate">
    <div class="gate-box">
      <h2>🔧 STAFF ONLY</h2>
      <p>관리자 비밀번호를 입력하세요</p>
      <input type="password" id="gatePass" inputmode="numeric" autocomplete="off" placeholder="••••••">
      <button class="btn btn-red" style="width:100%" onclick="checkGate()">입장</button>
      <div class="gate-err" id="gateErr"></div>
    </div>
  </div>

  <div class="admin-body" id="adminBody">
  <div class="admin-header">
    <div class="admin-title">🔧 관리자 패널</div>
    <div>
      <button class="btn btn-outline btn-small" onclick="window.location.href='index.html'">← 메인</button>
    </div>
  </div>

  <div class="container">
    <!-- 통계 -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="statTotal">-</div>
        <div class="stat-label">전체 계정</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:var(--green)" id="statIdle">-</div>
        <div class="stat-label">🟢 대기</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:#f1c40f" id="statPlaying">-</div>
        <div class="stat-label">🟡 사용중</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:var(--red)" id="statBusted">-</div>
        <div class="stat-label">🔴 파산</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:var(--accent)" id="statSettled">-</div>
        <div class="stat-label">✅ 정산</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:var(--gold)" id="statTotalChips">-</div>
        <div class="stat-label">🪙 총 유통 칩</div>
      </div>
    </div>

    <!-- 관리 버튼 -->
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
      <button class="btn btn-gold" onclick="handleGenerateAccounts()">📦 계정 60개 생성</button>
      <button class="btn btn-red" onclick="handleResetAll()">🔄 전체 초기화 (칩 리셋)</button>
      <button class="btn btn-outline" onclick="exportSettlement()">📋 정산표 내보내기</button>
    </div>

    <!-- 칩 일괄 지급 -->
    <div class="give-panel">
      <div class="give-title">🪙 칩 지급 / 차감 (실시간 반영)</div>
      <div class="give-row">
        <span class="give-label">전원 일괄</span>
        <input type="number" id="bulkAmount" value="500" step="10" placeholder="칩 수 (음수 = 차감)">
        <select id="bulkTarget">
          <option value="playing">🟡 사용중 계정만</option>
          <option value="active">🟢 대기 + 🟡 사용중</option>
          <option value="all">전체 (정산 완료 제외)</option>
        </select>
        <button class="btn btn-gold btn-small" onclick="giveBulk()">일괄 적용</button>
        <span class="give-hint">계정별 지급은 표 오른쪽 버튼 · 직접 입력은 ± 버튼</span>
      </div>
      <div class="give-log" id="giveLog"></div>
    </div>

    <!-- 필터 -->
    <div style="margin-bottom:15px; display:flex; gap:10px; align-items:center;">
      <span style="color:var(--text-dim); font-size:14px;">필터:</span>
      <button class="btn btn-outline btn-small filter-btn active" data-filter="all" onclick="setFilter('all')">전체</button>
      <button class="btn btn-outline btn-small filter-btn" data-filter="idle" onclick="setFilter('idle')">🟢 대기</button>
      <button class="btn btn-outline btn-small filter-btn" data-filter="playing" onclick="setFilter('playing')">🟡 사용중</button>
      <button class="btn btn-outline btn-small filter-btn" data-filter="busted" onclick="setFilter('busted')">🔴 파산</button>
      <button class="btn btn-outline btn-small filter-btn" data-filter="settled" onclick="setFilter('settled')">✅ 정산</button>
    </div>

    <!-- 계정 테이블 -->
    <div style="overflow-x:auto;">
      <table class="account-table" id="accountTable">
        <thead>
          <tr>
            <th>계정 ID</th>
            <th>PIN</th>
            <th>상태</th>
            <th>칩</th>
            <th>상품 등급</th>
            <th>칩 지급</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="accountBody">
          <tr><td colspan="7" style="text-align:center; padding:40px; color:var(--text-dim)">로딩 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  </div><!-- /admin-body -->

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    // ============ 관리자 비밀번호 게이트 ============
    // 비밀번호는 SHA-256 해시로만 저장. 바꾸려면 새 비밀번호의 해시를 아래에 넣으세요:
    //   node -e "console.log(require('crypto').createHash('sha256').update('새비밀번호').digest('hex'))"
    //   또는 브라우저 콘솔에서: await sha256('새비밀번호')
    const ADMIN_PASS_SHA256 = '7d2295a0460a4dc6798b088a0e16ea70584d549d326bf065766410496c3af351';
    const GATE_KEY = 'adminGateOk';
    let gateFails = 0;

    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    async function checkGate() {
      const input = document.getElementById('gatePass');
      const err = document.getElementById('gateErr');
      const hash = await sha256(input.value.trim());
      if (hash === ADMIN_PASS_SHA256) {
        sessionStorage.setItem(GATE_KEY, hash);
        openAdmin();
      } else {
        gateFails++;
        input.value = '';
        err.textContent = `비밀번호가 틀렸습니다 (${gateFails}회)`;
        if (gateFails >= 5) {
          err.textContent = '5회 실패 · 30초 후 다시 시도하세요';
          input.disabled = true;
          setTimeout(() => { input.disabled = false; gateFails = 0; err.textContent = ''; }, 30000);
        }
      }
    }
    document.getElementById('gatePass').addEventListener('keydown', e => { if (e.key === 'Enter') checkGate(); });

    let currentFilter = 'all';
    let allAccounts = {};
    let adminOpened = false;

    function openAdmin() {
      if (adminOpened) return;
      adminOpened = true;
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('adminBody').classList.add('open');
      // 실시간 계정 데이터 리스너 (인증 후에만 연결)
      db.ref('accounts').on('value', snap => {
        allAccounts = snap.val() || {};
        updateStats();
        renderTable();
      });
    }

    // 같은 탭에서 이미 인증했으면 바로 열기
    if (sessionStorage.getItem(GATE_KEY) === ADMIN_PASS_SHA256) openAdmin();
    else document.getElementById('gatePass').focus();

    function updateStats() {
      const accounts = Object.values(allAccounts);
      const total = accounts.length;
      const idle = accounts.filter(a => a.status === 'idle').length;
      const playing = accounts.filter(a => a.status === 'playing').length;
      const busted = accounts.filter(a => a.status === 'busted').length;
      const settled = accounts.filter(a => a.status === 'settled').length;
      const totalChips = accounts.reduce((sum, a) => sum + (a.chips || 0), 0);

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statIdle').textContent = idle;
      document.getElementById('statPlaying').textContent = playing;
      document.getElementById('statBusted').textContent = busted;
      document.getElementById('statSettled').textContent = settled;
      document.getElementById('statTotalChips').textContent = totalChips.toLocaleString();
    }

    function renderTable() {
      const tbody = document.getElementById('accountBody');
      const entries = Object.entries(allAccounts)
        .filter(([_, data]) => currentFilter === 'all' || data.status === currentFilter)
        .sort(([a], [b]) => a.localeCompare(b));

      if (entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px; color:var(--text-dim)">계정이 없습니다</td></tr>';
        return;
      }

      tbody.innerHTML = entries.map(([id, data]) => {
        const statusMap = {
          idle: ['🟢 대기', 'status-idle'],
          playing: ['🟡 사용중', 'status-playing'],
          busted: ['🔴 파산', 'status-busted'],
          settled: ['✅ 정산', 'status-settled']
        };
        const [statusText, statusClass] = statusMap[data.status] || ['⚪ 알수없음', ''];
        const grade = getPrizeGrade(data.chips);

        return `<tr>
          <td><strong>${id}</strong></td>
          <td style="color:var(--text-dim)">${data.pin}</td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          <td style="color:var(--gold); font-weight:700">${(data.chips || 0).toLocaleString()}</td>
          <td>${grade.emoji} ${grade.grade}</td>
          <td class="give-cell">
            <button class="give-btn plus" onclick="adjustChips('${id}', 100)">+100</button>
            <button class="give-btn plus" onclick="adjustChips('${id}', 500)">+500</button>
            <button class="give-btn minus" onclick="adjustChips('${id}', -100)">−100</button>
            <button class="give-btn custom" onclick="adjustCustom('${id}')">±</button>
          </td>
          <td>
            <button class="btn btn-outline btn-small" onclick="resetAccount('${id}')">초기화</button>
            ${data.status === 'playing' || data.status === 'busted' ? 
              `<button class="btn btn-small" style="background:var(--accent); color:#fff; margin-left:4px;" onclick="settleAccount('${id}', ${data.chips})">정산</button>` : ''}
          </td>
        </tr>`;
      }).join('');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
      renderTable();
    }

    // 계정 생성
    async function handleGenerateAccounts() {
      if (!confirm('계정 60개를 생성합니다. 기존 계정은 유지됩니다.')) return;
      await generateAccounts(60);
      alert('✅ 계정 60개 생성 완료!');
    }

    // 전체 초기화
    async function handleResetAll() {
      if (!confirm('⚠️ 모든 계정의 칩을 1,000으로 초기화합니다. 진행할까요?')) return;
      if (!confirm('정말로? 되돌릴 수 없습니다.')) return;

      const updates = {};
      Object.keys(allAccounts).forEach(id => {
        updates[`accounts/${id}/chips`] = INITIAL_CHIPS;
        updates[`accounts/${id}/status`] = 'idle';
        updates[`accounts/${id}/loginTime`] = null;
      });
      await db.ref().update(updates);
      alert('✅ 전체 초기화 완료');
    }

    // ============ 칩 지급 / 차감 (트랜잭션, 실시간 반영) ============
    const giveHistory = [];
    function logGive(text) {
      giveHistory.unshift(`${new Date().toLocaleTimeString('ko-KR', { hour12: false })} · ${text}`);
      if (giveHistory.length > 8) giveHistory.pop();
      document.getElementById('giveLog').innerHTML = giveHistory.map(t => `<div>${t}</div>`).join('');
    }
    // 칩을 amount 만큼 더한다 (0 미만 불가). 0에서 양수가 되면 파산 상태를 대기로 되돌린다.
    async function adjustChips(id, amount) {
      amount = Math.round(Number(amount));
      if (!amount) return;
      const ref = db.ref(`accounts/${id}/chips`);
      const result = await ref.transaction(cur => {
        if (cur === null) return cur;
        return Math.max(0, (cur || 0) + amount);
      });
      const after = result.snapshot.val();
      const acc = allAccounts[id] || {};
      if (after > 0 && acc.status === 'busted') await db.ref(`accounts/${id}/status`).set('idle');
      if (after <= 0 && acc.status !== 'settled') await db.ref(`accounts/${id}/status`).set('busted');
      // 기록 (DB 규칙에 chipLog 가 없으면 조용히 건너뜀)
      try { await db.ref('chipLog').push({ id, amount, after, at: firebase.database.ServerValue.TIMESTAMP }); } catch (e) {}
      logGive(`${id} ${amount > 0 ? '+' : ''}${amount.toLocaleString()} → ${after.toLocaleString()}`);
      return after;
    }
    async function adjustCustom(id) {
      const v = prompt(`${id} 에 지급할 칩 수를 입력하세요 (음수는 차감)\n현재: ${(allAccounts[id]?.chips || 0).toLocaleString()}`, '100');
      if (v === null) return;
      const n = Math.round(Number(v));
      if (!n) { alert('숫자를 입력하세요'); return; }
      await adjustChips(id, n);
    }
    async function giveBulk() {
      const n = Math.round(Number(document.getElementById('bulkAmount').value));
      const target = document.getElementById('bulkTarget').value;
      if (!n) { alert('칩 수를 입력하세요'); return; }
      const ids = Object.entries(allAccounts).filter(([_, a]) => {
        if (a.status === 'settled') return false;
        if (target === 'playing') return a.status === 'playing';
        if (target === 'active') return a.status === 'playing' || a.status === 'idle';
        return true;
      }).map(([id]) => id).sort();
      if (ids.length === 0) { alert('대상 계정이 없습니다'); return; }
      if (!confirm(`${ids.length}개 계정에 ${n > 0 ? '+' : ''}${n.toLocaleString()} 칩을 적용합니다. 진행할까요?`)) return;
      for (const id of ids) await adjustChips(id, n);
      logGive(`일괄 ${n > 0 ? '+' : ''}${n.toLocaleString()} × ${ids.length}개 계정 완료`);
      alert(`✅ ${ids.length}개 계정에 적용 완료`);
    }

    // 개별 계정 초기화
    async function resetAccount(id) {
      if (!confirm(`${id} 계정을 초기화합니다 (칩 → 1,000, 상태 → 대기)`)) return;
      await db.ref(`accounts/${id}`).update({
        chips: INITIAL_CHIPS,
        status: 'idle',
        loginTime: null
      });
    }

    // 정산 처리
    async function settleAccount(id, chips) {
      const grade = getPrizeGrade(chips);
      if (!confirm(`${id} 정산\n\n칩: ${chips.toLocaleString()}\n등급: ${grade.emoji} ${grade.grade}\n상품: ${grade.prize}\n\n정산 처리할까요?`)) return;
      await db.ref(`accounts/${id}`).update({
        status: 'settled',
        loginTime: null
      });
    }

    // 정산표 내보내기
    function exportSettlement() {
      const lines = ['계정ID,PIN,상태,칩,등급,상품'];
      Object.entries(allAccounts)
        .sort(([a], [b]) => a.localeCompare(b))
        .forEach(([id, data]) => {
          const grade = getPrizeGrade(data.chips);
          lines.push(`${id},${data.pin},${data.status},${data.chips},${grade.grade},${grade.prize}`);
        });

      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `casino_settlement_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }
  </script>

  <style>
    .give-panel {
      background: var(--bg-card); border: 1px solid rgba(212,168,67,0.25); border-radius: 12px;
      padding: 14px 18px; margin-bottom: 20px;
    }
    .give-title { color: var(--gold); font-weight: 700; font-size: 14px; margin-bottom: 10px; letter-spacing: 1px; }
    .give-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .give-label { color: var(--text-dim); font-size: 13px; }
    .give-row input, .give-row select {
      padding: 8px 10px; background: var(--bg-primary); border: 1px solid var(--gold-dark); border-radius: 8px;
      color: var(--gold-light); font-size: 14px; font-family: inherit; width: 150px;
    }
    .give-row select { color: var(--text); width: auto; }
    .give-hint { color: var(--text-dim); font-size: 12px; }
    .give-log { margin-top: 8px; font-size: 12px; color: var(--text-dim); line-height: 1.6; max-height: 70px; overflow-y: auto; }
    .give-log div:first-child { color: var(--green); }
    .give-cell { white-space: nowrap; }
    .give-btn {
      border: 1px solid rgba(255,255,255,0.15); background: var(--bg-secondary); color: var(--text);
      border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; margin-right: 3px;
    }
    .give-btn.plus { color: var(--green); border-color: rgba(46,204,113,0.4); }
    .give-btn.minus { color: var(--red); border-color: rgba(231,76,60,0.4); }
    .give-btn.custom { color: var(--gold-light); border-color: rgba(212,168,67,0.4); }
    .give-btn:hover { filter: brightness(1.3); }
    .filter-btn.active {
      background: var(--gold) !important;
      color: #000 !important;
      border-color: var(--gold) !important;
    }
  </style>
</body>
</html>
